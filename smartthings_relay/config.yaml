name: SmartThings LAN Relay
version: "0.1.3"
slug: smartthings_relay
description: SmartThings 기기 상태와 차량 제어를 Home Assistant에 연결하는 로컬 중계 앱
url: https://github.com/Qualified4/ha-relay-apps
arch: [aarch64, amd64]
image: ghcr.io/qualified4/smartthings-ha-relay
startup: application
boot: auto
init: false
homeassistant_api: true
services:
  - mqtt:need
ports:
  18088/tcp: 18088
ports_description:
  18088/tcp: 인증된 Edge 로컬 중계
watchdog: http://[HOST]:[PORT:18088]/health
options:
  hub_ip: ""
  sources: []
  relay_key: ""
  event_type: smartthings_lan_relay
schema:
  hub_ip: str
  sources:
    - str
  relay_key: password
  event_type: str
